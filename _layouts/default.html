---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js"{% if site.site_theme == "dark" %} data-theme="dark"{% endif %}>
  <style>
  .page__content p{% if page.url == '/' %},
  .page__content ul > li{% endif %} {
      text-align: justify;
  }
  {% if page.url == '/' %}
  .page__content #news + ul > li {
      position: relative;
      padding-left: 6em;
      text-align: left;
  }
  .page__content #news + ul > li > strong:first-child {
      position: absolute;
      top: 0;
      left: 0;
      width: 5.5em;
      text-align: left;
      white-space: nowrap;
  }
  {% endif %}
  </style>
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    {% include footer/custom.html %}

    {% include scripts.html %}

  </body>
</html>
